version: 2

# Minor and patch updates come as one PR per ecosystem and week,
# major updates as separate PRs. Security updates skip the cooldown.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zurich
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ['*']
